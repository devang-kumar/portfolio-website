<main class="main-content">
    <section class="contact-section">
        <h2 class="section-title">Get in <span class="title-accent">Touch</span></h2>

        <p style="color:var(--muted);margin-bottom:36px;font-size:15px;max-width:500px">Open to collaborations, internships, or just a friendly hello.</p>
        <div class="contact-container">
            <div class="contact-info">
                <div class="contact-item">
                    <div class="contact-icon"><i class="fas fa-map-marker-alt"></i></div>

                </div>
                <div class="contact-item">
                    <div class="contact-icon"><i class="fas fa-phone-alt"></i></div>
                    <div class="contact-details"><h4>Phone</h4><p>+91 9968 ******</p></div>
                </div>
                <div class="contact-item">
                    <div class="contact-icon"><i class="fas fa-envelope"></i></div>
                    <div class="contact-details"><h4>Email</h4><p>devangkumar12112005@gmail.com</p></div>
                </div>
                <div class="contact-item">

            <div class="contact-form-wrap">

                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="What's on your mind?" required></textarea>
                    </div>
                    <button type="submit" id="submit-btn" class="btn btn-primary" style="margin-top:8px">
                        <i class="fas fa-paper-plane"></i> Send Message
                    </button>
                    <div id="form-status" style="display:none;margin-top:14px;padding:12px 16px;border-radius:8px;font-size:13px"></div>
                </form>
            </div>

</main>
<script>
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);
class Particle { constructor() { this.reset(); } reset() { this.x=Math.random()*canvas.width; this.y=Math.random()*canvas.height; this.size=Math.random()*1.5+0.3; this.speedX=(Math.random()-0.5)*0.4; this.speedY=(Math.random()-0.5)*0.4; this.opacity=Math.random()*0.5+0.1; this.color=Math.random()>0.7?'#7c3aed':'#00f5ff'; } update() { this.x+=this.speedX; this.y+=this.speedY; if(this.x<0||this.x>canvas.width||this.y<0||this.y>canvas.height)this.reset(); } draw() { ctx.save(); ctx.globalAlpha=this.opacity; ctx.fillStyle=this.color; ctx.shadowBlur=6; ctx.shadowColor=this.color; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); ctx.restore(); } }
for(let i=0;i<120;i++)particles.push(new Particle());
function drawGrid(){ctx.strokeStyle='rgba(0,245,255,0.03)';ctx.lineWidth=1;const s=60;for(let x=0;x<canvas.width;x+=s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}for(let y=0;y<canvas.height;y+=s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}}
function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);drawGrid();particles.forEach(p=>{p.update();p.draw();});for(let i=0;i<particles.length;i++){for(let j=i+1;j<particles.length;j++){const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<100){ctx.save();ctx.globalAlpha=(1-d/100)*0.08;ctx.strokeStyle='#00f5ff';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.stroke();ctx.restore();}}}requestAnimationFrame(animate);}
animate();
document.getElementById('contact-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const btn    = document.getElementById('submit-btn');
    const status = document.getElementById('form-status');

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
    status.style.display = 'none';

    const formData = new FormData(this);
    formData.append('access_key', '01d58cf8-b176-408f-9ecf-1db14f174956');

    try {
        const res  = await fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            body: formData
        });
        const data = await res.json();

        if (data.success) {
            status.style.display = 'block';
            status.style.background = 'rgba(0,245,255,0.06)';
            status.style.border = '1px solid rgba(0,245,255,0.25)';
            status.style.color = 'var(--neon)';
            status.innerHTML = '<i class="fas fa-check-circle" style="margin-right:8px"></i>Message sent! I\'ll get back to you soon.';
            this.reset();
        } else {
            throw new Error(data.message || 'Submission failed');
        }
    } catch (err) {
        status.style.display = 'block';
        status.style.background = 'rgba(239,68,68,0.06)';
        status.style.border = '1px solid rgba(239,68,68,0.25)';
        status.style.color = '#ef4444';
        status.innerHTML = '<i class="fas fa-exclamation-circle" style="margin-right:8px"></i>Something went wrong. Please try again.';
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Message';
    }
});
</script>
